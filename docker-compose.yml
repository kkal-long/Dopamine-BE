services:
  nginx-auction:
    container_name: nginx-auction
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - auction-network
    depends_on:
      - springboot-auction
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  springboot-auction:
    container_name: springboot-auction
    image: springboot-auction:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-auction:3306/auctiondb
      - SPRING_DATASOURCE_USERNAME=dev
      - SPRING_DATASOURCE_PASSWORD=dev123
    networks:
      - auction-network
    depends_on:
      - mysql-auction

  mysql-auction:
    container_name: mysql-auction
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: root1ㅇ23
      MYSQL_DATABASE: auctiondb
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - auction-network

networks:
  auction-network:
    driver: bridge

volumes:
  mysql-data: